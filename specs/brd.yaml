# specs/brd.yaml
# Business Requirements Document (BRD) for Ebook Generator
# This is the canonical BRD referenced by all agents

project:
  name: "LangChain na Saúde - Agentes de IA para Clínica"
  description: "Guia prático sobre implementação de agentes LangChain 1.0 em ambientes clínicos com compliance e ética"
  target_audience: "Engenheiros, médicos residentes e profissionais de saúde interessados em IA clínica"
  language: "Portuguese (Brazilian)"

objectives:
  primary: "Ensinar implementação segura e ética de agentes LangChain em contextos clínicos"
  secondary:
    - "Demonstrar arquitetura RAG em EHRs"
    - "Garantir compliance e auditoria"
    - "Balancear automação com revisão humana"
    - "Implementar transparência algorítmica"

writing_style:
  inspiration:
    - "Abordagem técnica rigorosa"
    - "Sensibilidade para contexto clínico humanizado"
  tone: "Técnico mas acessível, com foco em responsabilidade"
  approach: "Prático, com exemplos reais de implementação"
  characteristics:
    - "Código executável e testado"
    - "Casos de uso clínicos reais"
    - "Discussão de trade-offs éticos"
    - "Guias de implementação step-by-step"

content_structure:
  chapters:
    - name: "Introdução"
      purpose: "Contexto clínico e por que LangChain importa"
      elements:
        - "Desafios atuais em clínicas: sobrecarga de dados"
        - "O que é LangChain e por que usar"
        - "Visão geral de agentes em saúde"
        - "Caso de uso real do autor"
    
    - name: "Fundamentos"
      purpose: "Conceitos técnicos essenciais de LangChain"
      elements:
        - "Arquitetura de agentes LangChain 1.0"
        - "Tools, models e memory"
        - "RAG em contexto clínico"
        - "Exemplos de código"
    
    - name: "RAG Clínico"
      purpose: "Implementação de RAG com EHRs"
      elements:
        - "Integração com Supabase pgvector"
        - "Embedding de anotações clínicas"
        - "Recuperação semântica segura"
        - "Exemplo prático com dados sintéticos"
    
    - name: "Compliance e Auditoria"
      purpose: "Garantia de compliance clínico"
      elements:
        - "Trilhas de auditoria para decisões"
        - "LGPD e proteção de dados"
        - "Conformidade com protocolos clínicos"
        - "Logging estruturado de decisões"
    
    - name: "Validação Humana"
      purpose: "Revisão humana obrigatória"
      elements:
        - "Implementar review loops"
        - "Sinais de confiança do agente"
        - "Workflow de aprovação médica"
        - "Tratamento de outliers"
    
    - name: "Casos de Uso"
      purpose: "Implementações práticas reais"
      elements:
        - "Resumo de anotações clínicas"
        - "Triagem inicial de pacientes"
        - "Sugestão de diagnósticos (apenas humano decide)"
        - "Monitoramento contínuo pós-internação"
    
    - name: "Próximos Passos"
      purpose: "Roadmap e considerações finais"
      elements:
        - "Deploying em produção"
        - "Monitoramento e iteração"
        - "Ética e responsabilidade contínua"
        - "Comunidade e recursos"

output_requirements:
  format: "Markdown"
  file: "result/ebook.md"
  base_template: "templates/template.md"
  no_json_output: true
  validation:
    - "Content must be in Portuguese (Brazilian)"
    - "Must follow the 7-chapter structure"
    - "Must include code examples"
    - "Must address compliance and ethics"
    - "Must be technically accurate"

quality_criteria:
  - "Código é executável e testado"
  - "Exemplos são realistas e clínicos"
  - "Explica trade-offs éticos"
  - "Acessível a engenheiros e médicos"
  - "Balance entre teoria e prática"
  - "Foco em responsabilidade"
  - "Fluxo lógico entre tópicos"
  - "Atende necessidades do público-alvo"
