# Business Requirements Document (BRD)
# Canonical source for ebook generator requirements
# Path: specs/brd.yaml

project:
  name: "Ebook Generator - Self-Development Content"
  version: "0.1.0"
  description: "AI-powered ebook generation system for self-development content in Portuguese"

business_objectives:
  primary: "Create high-quality self-development ebooks that inspire and guide readers in emotional intelligence and self-awareness"
  secondary:
    - "Produce content in the style of Roberto Shinyashiki (practical approach) and Pe. Fábio de Melo (spiritual sensitivity)"
    - "Target beginners in self-awareness and emotional intelligence"
    - "Provide actionable practices and deep reflections"

target_audience:
  primary_persona:
    pain: "Suffers from low self-esteem, feels insecure, and has difficulty accepting themselves, affecting personal and professional relationships"
    desire: "Dreams of having self-confidence, wants to accept themselves without judgment, and improve personal and professional relationships"
  
  demographics:
    - Portuguese-speaking readers
    - Beginners in self-knowledge and emotional intelligence
    - Seeking practical and inspirational guidance

content_requirements:
  structure:
    format: "Markdown"
    output_file: "result/ebook.md"
    template: "templates/template.md"
    words_per_paragraph: 70
  
  chapters:
    - name: "Introdução"
      description: "Introduction with engaging story about self-knowledge and emotional intelligence importance"
    - name: "Problema"
      description: "Challenges related to self-knowledge and emotional management"
    - name: "Identificação"
      description: "Personal stories creating emotional connection with readers"
    - name: "Solução"
      description: "Practical method with step-by-step approach (ideally with acronym)"
    - name: "Proteção"
      description: "Alert about self-sabotaging behaviors and how to avoid them"
    - name: "Permissão"
      description: "Psychological permission for readers to seek happiness"
    - name: "Potência"
      description: "Celebration and motivation to embrace change and apply learnings"

writing_style:
  tone:
    - "Motivational and reflective"
    - "Simple language with poetic touch"
    - "Emotional and engaging narrative"
  
  approach:
    - "Practical like Roberto Shinyashiki"
    - "Spiritually sensitive like Pe. Fábio de Melo (but non-religious)"
    - "Use metaphors and engaging storytelling"
  
  structure:
    - "Small sections with clear titles"
    - "Start with inspirational story or anecdote"
    - "End each section with concrete practice and personal reflection"
    - "Include practical examples for daily application"

author_information:
  name: "Igor S de Medeiros"
  email: "igor@igormedeiros.com.br"
  publisher: "Instituto Medeiros"
  year: "2024"

quality_standards:
  - "Content must be original and avoid plagiarism"
  - "Include evidence from scientific articles when possible"
  - "Use inspirational stories showing theme importance"
  - "Provide concrete tools for self-knowledge and emotional intelligence"
  - "Language accessible to beginners while maintaining depth"

output_constraints:
  forbidden:
    - "JSON output format"
    - "Technical jargon without explanation"
    - "Religious content (spiritual but not religious)"
  
  required:
    - "Output to result/ebook.md file"
    - "Markdown formatting"
    - "Portuguese language"
    - "Personal touch with author's authentic voice"
