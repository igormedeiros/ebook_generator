# specs/brd.yaml
# Business Requirements Document (BRD) for Ebook Generator
# This is the canonical BRD referenced by all agents

project:
  name: "LangChain na Saúde - Agentes de IA para Clínica"
  description: "Guia prático sobre implementação de agentes LangChain 1.0 em ambientes clínicos com compliance e ética"
  target_audience: "Engenheiros, médicos residentes e profissionais de saúde interessados em IA clínica"
  language: "Portuguese (Brazilian)"
  number_chapters: 10
  target_word_count: 15000
  required_topics:
    - "LangChain 1.0"
    - "RAG"
    - "Memory em LangChain"
    - "Compliance em Saúde"
    - "Ética em IA"
    - "Agentes RAG"
    - "Registros Eletrônicos de Saúde (EHRs)"
    - "Compliance em Saúde"
    - "Chainlit"
  main_use_case:
    description: "Chat conversacional com UI Chainlit usando Langchain 1.0 e RAG com chromadb para responder sobre dados de evolução clínica de pacientes internados numa UTI"
    features:
      - "Implementação de agentes LangChain 1.0"
      - "Arquitetura RAG com EHRs"
      - "Compliance e auditoria"
      - "Balanceamento entre automação e revisão humana"
      - "UI Chainlit"

writing_style:
  file: "specs/system_writer.md"

content_structure:
  num_chapters: 10
  chapter_structure:
  target_word_count: 15000
  structure_prompt: "Crie uma estrutura de <num_chapters> capítulos para este ebook, cada um com nome, propósito e elementos obrigatórios a incluir. Total de aproximadamente <target_word_count> palavras. Os capitulos devem seguir a estrutura: <chapter_structure>"

output_requirements:
  format: "Markdown"
  file: "result/ebook.md"
  base_template: "templates/template.md"
  no_json_output: true
  validation:
    - "Content must be in Portuguese (Brazilian)"
    - "Must follow the number of chapters structure defined in the BRD"
    - "Target approximately 15000 words"
    - "Must include code examples"
    - "Must be technically accurate"

quality_criteria:
  - "Código é executável e testado"
  - "Exemplos são realistas e clínicos"
  - "Explica trade-offs éticos"
  - "Acessível a engenheiros e médicos"
  - "Balance entre teoria e prática"
  - "Foco em responsabilidade"
  - "Fluxo lógico entre tópicos"
  - "Atende necessidades do público-alvo"
