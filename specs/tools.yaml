tool_categories:
  ideation:
    description: "Pesquisa rápida para DEL e ideação"
    tools:
      - search_knowledge_base
      - retrieve_rag_context

  title_generation:
    description: "Otimização de título/subtítulo"
    tools:
      - generate_amazon_optimized_title
      - validate_title_seo
      - search_knowledge_base

  structure:
    description: "Geração de outline e validações"
    tools:
      - generate_outline
      - count_words
      - validate_structure

  research:
    description: "Pesquisa externa e vetorização"
    tools:
      - query_context7_mcp
      - perform_deep_research
      - vectorize_research
      - store_in_rag_external
      - retrieve_rag_context

  writing:
    description: "Escrita com contexto e voz do autor"
    tools:
      - retrieve_rag_context
      - retrieve_author_stories
      - retrieve_author_positioning
      - retrieve_author_vision
      - format_markdown
      - count_words

  review:
    description: "Revisão especializada e leitores virtuais"
    tools:
      - review_tone_and_engagement
      - review_clarity_and_empathy
      - review_grammar_and_style
      - review_logical_flow
      - review_code_examples
      - validate_content_quality

  editing:
    description: "Edição e acabamento"
    tools:
      - format_markdown
      - validate_content_quality
      - validate_structure

  finalization:
    description: "Capa, metadata e resumo KDP"
    tools:
      - generate_cover
      - generate_kdp_metadata
      - validate_content_quality

  publication:
    description: "Exportação e pacote KDP"
    tools:
      - export_to_docx
      - export_to_epub
      - export_to_pdf
      - export_to_json
      - generate_kdp_metadata

tools:
  search_knowledge_base:
    description: "Busca semântica em Supabase"
    parameters:
      query:
        type: string
        required: true

  retrieve_rag_context:
    description: "Recupera contexto vetorial"
    parameters:
      query:
        type: string
        required: true
      max_results:
        type: integer
        default: 3

  generate_amazon_optimized_title:
    description: "Cria título sugerido com foco em SEO"
    parameters:
      topic:
        type: string
        required: true
      target_audience:
        type: string
        required: true

  validate_title_seo:
    description: "Verifica pontuação de SEO do título"
    parameters:
      title:
        type: string
        required: true

  generate_outline:
    description: "Gera outline básico com capítulos"
    parameters:
      topic:
        type: string
        required: true
      word_count_target:
        type: integer
        required: true

  count_words:
    description: "Conta palavras de um texto"
    parameters:
      content:
        type: string
        required: true

  validate_structure:
    description: "Valida presença de intro/conclusão e contagem"
    parameters:
      outline:
        type: object
        required: true

  query_context7_mcp:
    description: "Consulta Context7 MCP"
    parameters:
      topic:
        type: string
        required: true
      query_type:
        type: string
        default: "research"

  perform_deep_research:
    description: "Agrupa achados externos"
    parameters:
      topic:
        type: string
        required: true
      research_depth:
        type: string
        default: "standard"

  vectorize_research:
    description: "Gera embeddings e metadados"
    parameters:
      research_findings:
        type: object
        required: true

  store_in_rag_external:
    description: "Registra vetores em Supabase"
    parameters:
      vectorized_data:
        type: object
        required: true
      topic:
        type: string
        required: true

  retrieve_author_stories:
    description: "Recupera histórias autorais"
    parameters:
      author_name:
        type: string
        required: true
      max_results:
        type: integer
        default: 3

  retrieve_author_positioning:
    description: "Posicionamento do autor"
    parameters:
      author_name:
        type: string
        required: true
      max_results:
        type: integer
        default: 3

  retrieve_author_vision:
    description: "Visão/valores do autor"
    parameters:
      author_name:
        type: string
        required: true
      max_results:
        type: integer
        default: 3

  format_markdown:
    description: "Adiciona título e separador em Markdown"
    parameters:
      title:
        type: string
        required: true
      content:
        type: string
        required: true

  validate_content_quality:
    description: "Retorna métricas simples de qualidade"
    parameters:
      content:
        type: string
        required: true

  review_tone_and_engagement:
    description: "Checklist de tom/engajamento"
    parameters:
      content:
        type: string
        required: true

  review_clarity_and_empathy:
    description: "Checklist de clareza"
    parameters:
      content:
        type: string
        required: true

  review_grammar_and_style:
    description: "Checklist de gramática"
    parameters:
      content:
        type: string
        required: true

  review_logical_flow:
    description: "Checklist de coerência"
    parameters:
      content:
        type: string
        required: true

  review_code_examples:
    description: "Checklist de exemplos de código"
    parameters:
      content:
        type: string
        required: true

  generate_cover:
    description: "Retorna mensagem de capa gerada"
    parameters:
      title:
        type: string
        required: true
      subtitle:
        type: string
        required: true
      author:
        type: string
        required: true

  export_to_docx:
    description: "Exportação mock DOCX"
    parameters:
      content:
        type: string
        required: true
      title:
        type: string
        required: true

  export_to_epub:
    description: "Exportação mock EPUB"
    parameters:
      content:
        type: string
        required: true
      title:
        type: string
        required: true

  export_to_pdf:
    description: "Exportação mock PDF"
    parameters:
      content:
        type: string
        required: true
      title:
        type: string
        required: true

  export_to_json:
    description: "Exportação mock JSON"
    parameters:
      content:
        type: string
        required: true
      title:
        type: string
        required: true
      metadata:
        type: object
        required: false

  generate_kdp_metadata:
    description: "Gera JSON de metadados KDP"
    parameters:
      title:
        type: string
        required: true
      author:
        type: string
        required: true
      category:
        type: string
        required: true
      keywords:
        type: array
        item_type: string
        required: true

defaults:
  rag_top_k: 5
  timeout_seconds: 180
  token_limit_per_call: 4096
