# Configuração de Ferramentas (Tools) - Ebook Generator 1.0

tool_categories:
  ideation:
    description: "Ferramentas para Estágio 1: Ideação"
    tools:
      - search_knowledge_base
      - retrieve_rag_context
      - validate_audience_fit
      - generate_value_proposition

  title_generation:
    description: "Ferramentas para Estágio 2: Geração de Títulos"
    tools:
      - search_bestsellers
      - optimize_for_amazon_seo
      - validate_title_length
      - check_amazon_compliance

  structure:
    description: "Ferramentas para Estágio 3: Estrutura"
    tools:
      - generate_outline
      - calculate_word_distribution
      - validate_didactic_progression
      - create_chapter_definitions

  deep_research:
    description: "Ferramentas para Estágio 4A: Pesquisa Profunda"
    tools:
      - query_context7_mcp
      - perform_deep_research
      - vectorize_research
      - store_in_rag_external
      - validate_source_credibility

  writing:
    description: "Ferramentas para Estágio 4B: Escrita"
    tools:
      - retrieve_rag_external_research
      - retrieve_author_stories_rag
      - retrieve_author_positioning_rag
      - retrieve_author_vision_rag
      - generate_chapter_content
      - validate_content_quality

  review:
    description: "Ferramentas para Estágio 5: Revisão"
    tools:
      - execute_review_personas
      - aggregate_feedback
      - prioritize_issues
      - generate_review_report

  critical_reading:
    description: "Ferramentas para Estágio 6: Leitura Crítica"
    tools:
      - execute_critical_reading_iterations
      - analyze_reader_feedback
      - prioritize_refinements
      - measure_improvement

  editing:
    description: "Ferramentas para Estágio 7: Edição"
    tools:
      - validate_markdown
      - fix_formatting
      - check_heading_hierarchy
      - ensure_consistency

  finalization:
    description: "Ferramentas para Estágio 8: Finalização"
    tools:
      - generate_cover
      - compile_metadata
      - generate_summary
      - create_toc
      - generate_glossary

  publication:
    description: "Ferramentas para Estágio 9: Publicação"
    tools:
      - export_to_docx
      - export_to_epub
      - export_to_pdf
      - export_to_json
      - validate_kdp_compliance
      - prepare_for_publication

tools:
  # Ideation Tools
  search_knowledge_base:
    description: "Busca na base de conhecimento por tópicos relacionados"
    parameters:
      query:
        type: string
        required: true
        description: "Query de busca"
      limit:
        type: integer
        default: 5
        description: "Número máximo de resultados"

  retrieve_rag_context:
    description: "Recupera contexto de RAG para enriquecimento"
    parameters:
      query:
        type: string
        required: true
      source:
        type: string
        enum: ["external", "author_stories", "author_positioning", "author_vision"]
      top_k:
        type: integer
        default: 3

  # Title Generation Tools
  search_bestsellers:
    description: "Pesquisa bestsellers em nicho específico"
    parameters:
      category:
        type: string
        required: true
      limit:
        type: integer
        default: 10

  optimize_for_amazon_seo:
    description: "Otimiza título para algoritmo de busca Amazon"
    parameters:
      title:
        type: string
        required: true
      keywords:
        type: array
        item_type: string
      category:
        type: string

  # Structure Tools
  generate_outline:
    description: "Gera outline hierárquico do livro"
    parameters:
      central_idea:
        type: string
        required: true
      word_count_target:
        type: integer
        required: true
      chapter_count:
        type: integer
      didactic_progression:
        type: boolean
        default: true

  calculate_word_distribution:
    description: "Calcula distribuição de palavras entre capítulos"
    parameters:
      total_words:
        type: integer
        required: true
      chapter_count:
        type: integer
        required: true
      weights:
        type: object
        description: "Pesos customizados por seção"

  # Deep Research Tools
  query_context7_mcp:
    description: "Consulta Context7 MCP Server para bases de conhecimento"
    parameters:
      topic:
        type: string
        required: true
      query_types:
        type: array
        item_type: string
        enum: ["research", "trends", "case_studies", "expert_perspectives"]
      source_limit:
        type: integer
        default: 5

  perform_deep_research:
    description: "Executa pesquisa profunda usando Gemini 2.5 Pro"
    parameters:
      topic:
        type: string
        required: true
      research_depth:
        type: string
        enum: ["quick", "standard", "comprehensive"]
      sources:
        type: array
        item_type: object

  vectorize_research:
    description: "Vetoriza resultados de pesquisa com embeddings Gemini"
    parameters:
      research_content:
        type: string
        required: true
      topic:
        type: string
        required: true
      chapter_id:
        type: string
        required: true

  store_in_rag_external:
    description: "Armazena pesquisa vetorizada em rag_external"
    parameters:
      vectors:
        type: array
        required: true
      metadata:
        type: object
        required: true
      table:
        type: string
        default: "rag_external"

  # Writing Tools
  retrieve_rag_external_research:
    description: "Recupera pesquisa vetorizada do rag_external"
    parameters:
      chapter_topic:
        type: string
        required: true
      top_k:
        type: integer
        default: 3

  retrieve_author_stories_rag:
    description: "Recupera histórias do autor de rag_author_stories"
    parameters:
      topic:
        type: string
        required: true
      relevance_threshold:
        type: number
        default: 0.7

  generate_chapter_content:
    description: "Gera conteúdo de capítulo com contexto RAG"
    parameters:
      chapter_outline:
        type: object
        required: true
      research_context:
        type: array
        item_type: object
      author_context:
        type: object

  # Review Tools
  execute_review_personas:
    description: "Executa revisão com todos os 10 personas"
    parameters:
      content:
        type: string
        required: true
      active_personas:
        type: array
        item_type: string
        default: ["all"]

  aggregate_feedback:
    description: "Agrega feedback de múltiplos personas"
    parameters:
      feedback:
        type: array
        item_type: object
        required: true
      strategy:
        type: string
        enum: ["majority", "consensus", "weighted"]
        default: "weighted"

  # Critical Reading Tools
  execute_critical_reading_iterations:
    description: "Executa 3 ciclos de leitura crítica com leitores virtuais"
    parameters:
      content:
        type: string
        required: true
      active_readers:
        type: array
        item_type: string
        default: ["all"]
      iteration_count:
        type: integer
        default: 3

  analyze_reader_feedback:
    description: "Analisa feedback de leitores virtuais"
    parameters:
      feedback:
        type: array
        item_type: object
        required: true
      iteration:
        type: integer

  # Editing Tools
  validate_markdown:
    description: "Valida sintaxe Markdown do documento"
    parameters:
      content:
        type: string
        required: true
      standard:
        type: string
        enum: ["commonmark", "gfm", "github"]
        default: "commonmark"

  fix_formatting:
    description: "Corrige formatação do documento"
    parameters:
      content:
        type: string
        required: true
      rules:
        type: object

  # Publication Tools
  export_to_docx:
    description: "Exporta para formato DOCX"
    parameters:
      content:
        type: string
        required: true
      output_path:
        type: string
        required: true
      include_metadata:
        type: boolean
        default: true

  export_to_epub:
    description: "Exporta para formato EPUB"
    parameters:
      content:
        type: string
        required: true
      output_path:
        type: string
        required: true
      metadata:
        type: object

  export_to_pdf:
    description: "Exporta para formato PDF"
    parameters:
      content:
        type: string
        required: true
      output_path:
        type: string
        required: true
      template:
        type: string
        enum: ["standard", "colored", "minimal"]

  validate_kdp_compliance:
    description: "Valida compatibilidade com KDP Amazon"
    parameters:
      content:
        type: string
        required: true
      strict_mode:
        type: boolean
        default: true

defaults:
  rag_top_k: 5
  timeout_seconds: 300
  max_retries: 3
  retry_delay_seconds: 5
  token_limit_per_call: 4096
