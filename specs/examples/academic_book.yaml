# Exemplo de Configuração: Livro Acadêmico
# Para pesquisadores e estudantes de pós-graduação

project_name: "Análise Quantitativa em Ciências Sociais"
project_type: "academic_book"

input:
  topic: "Métodos quantitativos aplicados às ciências sociais"
  target_audience: "Pesquisadores, mestrandos e doutorandos"
  word_count_target: 45000
  transformation_promise: "Dominar técnicas quantitativas para pesquisa social rigorosa"
  reading_level: "advanced"

stage_overrides:
  stage_1_ideation:
    reading_level: "advanced"
    
  stage_2_title:
    seo_keywords: ["pesquisa quantitativa", "métodos sociais", "estatística", "ciências sociais"]
    market_category: "Science & Technology"
    
  stage_3_structure:
    outline_depth: 4
    chapter_count: 12
    didactic_progression: true
    section_weights:
      introduction: 5
      fundamentals: 15
      methodology: 30
      applications: 35
      conclusions: 15
    
  stage_4a_deep_research:
    query_types: ["research", "case_studies", "expert_perspectives"]
    research_depth: "comprehensive"
    source_limit: 10
    credibility_threshold: 0.85
    
  stage_4b_chapter_writing:
    chapter_template: "technical"
    rag_context_limit: 5
    author_voice_weight: 0.4
    example_count: 3
    include_exercises: true
    
  stage_5_review:
    active_personas: ["technical", "editorial", "research_validator"]
    feedback_aggregation: "consensus"
    threshold_score: 0.85
    
  stage_6_critical_reading:
    iteration_cycles: 3
    active_virtual_readers: ["technical_professional", "domain_specialist", "didactic_educator"]
    cycle_focus: ["accuracy", "depth", "clarity"]
    refinement_threshold: 0.8
    
  stage_7_editing:
    markdown_standard: "github"
    line_length_max: 120
    
  stage_8_finalization:
    cover_style: "minimalist"
    include_toc: true
    include_glossary: true
    
  stage_9_publication:
    export_formats: ["pdf", "epub"]
    kdp_compliance_strict: true

# Configurações específicas acadêmicas
academic_settings:
  include_bibliography: true
  bibliography_style: "apa"
  include_citations: true
  citation_format: "academic"
  include_index: true
  include_figures_tables: true
  code_syntax_highlight: true
  formula_support: "latex"
