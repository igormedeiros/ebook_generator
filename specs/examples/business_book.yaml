# Exemplo de Configuração: Livro de Negócios
# Para empreendedores e gestores

project_name: "Escalabilidade: Do Startup ao Unicórnio"
project_type: "business_book"

input:
  topic: "Estratégias de crescimento escalável para startups"
  target_audience: "Empreendedores e executivos de startups"
  word_count_target: 30000
  transformation_promise: "Construir um negócio escalável e rentável"
  reading_level: "intermediary"

stage_overrides:
  stage_1_ideation:
    reading_level: "intermediary"
    
  stage_2_title:
    seo_keywords: ["startup", "crescimento", "escalabilidade", "empreendedorismo"]
    market_category: "Business & Money"
    
  stage_3_structure:
    outline_depth: 3
    chapter_count: 9
    didactic_progression: true
    section_weights:
      foundation: 12
      strategy: 28
      execution: 35
      case_studies: 15
      conclusion: 10
    
  stage_4a_deep_research:
    query_types: ["research", "case_studies", "trends", "expert_perspectives"]
    research_depth: "comprehensive"
    source_limit: 7
    credibility_threshold: 0.8
    
  stage_4b_chapter_writing:
    chapter_template: "standard"
    rag_context_limit: 4
    author_voice_weight: 0.7
    example_count: 3
    include_exercises: true
    
  stage_5_review:
    active_personas: ["technical", "editorial", "author_positioning"]
    feedback_aggregation: "weighted"
    threshold_score: 0.8
    
  stage_6_critical_reading:
    iteration_cycles: 3
    active_virtual_readers: ["technical_professional", "reflective_reader"]
    cycle_focus: ["accuracy", "engagement", "clarity"]
    refinement_threshold: 0.75
    
  stage_7_editing:
    markdown_standard: "commonmark"
    line_length_max: 100
    
  stage_8_finalization:
    cover_style: "modern"
    include_toc: true
    include_glossary: false
    
  stage_9_publication:
    export_formats: ["epub", "pdf", "docx"]
    kdp_compliance_strict: true

# Configurações específicas de negócios
business_settings:
  include_case_studies: true
  include_frameworks: true
  include_templates: true
  include_metrics: true
  include_resources: true
  include_author_experience: true
  validate_business_claims: true
  include_financial_disclaimer: true
