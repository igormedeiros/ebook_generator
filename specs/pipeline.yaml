stages:
  stage_1_document_spec:
    name: "Documento de Especificação"
    description: "Superagente Editor-Chefe consolida BRD com ideia, promessa e direcionadores."
    agent: "document_spec_agent"
    parameters:
      topic:
        type: string
        required: true
        description: "Tema principal informado pelo usuário"
      target_audience:
        type: string
        required: true
        description: "Público-alvo prioritário"
      word_count_target:
        type: integer
        required: true
        default: 15000
        min: 5000
        max: 100000
      reading_level:
        type: string
        default: "intermediate"
        enum: ["beginner", "intermediate", "advanced"]
      author_name:
        type: string
        required: false
      author_bio:
        type: string
        required: false

  stage_2_ideation:
    name: "Ideação"
    description: "Expande promessa, define problema central e voz editorial."
    agent: "ideation_agent"
    parameters:
      brd_id:
        type: string
        required: true
        description: "Identificador do BRD gerado no estágio 1"
      include_market_scan:
        type: boolean
        default: true

  stage_3_title_generation:
    name: "Título e Subtítulo"
    description: "Pesquisa best-sellers e gera 3 variações otimizadas para Amazon."
    agent: "title_agent"
    parameters:
      title_count:
        type: integer
        default: 3
        min: 1
        max: 5
      enforce_amazon_rules:
        type: boolean
        default: true

  stage_4_structure:
    name: "Estrutura"
    description: "Cria capítulos, seções e distribuição de palavras."
    agent: "structure_agent"
    parameters:
      outline_depth:
        type: integer
        default: 3
        min: 1
        max: 4
      didactic_progression:
        type: boolean
        default: true

  stage_5_research:
    name: "Pesquisa Profunda"
    description: "Executa busca Context7 + Supabase e registra em rag_external."
    agent: "deep_research_agent"
    parameters:
      query_types:
        type: array
        item_type: string
        default: ["research", "case_studies", "trends"]
      source_limit:
        type: integer
        default: 5
        min: 1
        max: 10
      credibility_threshold:
        type: number
        default: 0.7
        min: 0.0
        max: 1.0

  stage_6_writing:
    name: "Escrita"
    description: "Produz capítulos integrais com RAG e voz do autor."
    agent: "chapter_writing_agent"
    parameters:
      rag_strategy:
        type: string
        default: "local_full_context"
        enum: ["local_full_context", "local_chromadb", "supabase_cloud"]
        description: "Define a origem do contexto: KB local completa, vetor local (Chroma) ou Supabase Cloud."
      rag_context_limit:
        type: integer
        default: 3
        min: 1
        max: 6
      include_exercises:
        type: boolean
        default: true

  stage_7_specialized_review:
    name: "Revisão Especializada"
    description: "Coordena personas técnicas/editoriais para feedback consolidado."
    agent: "review_coordinator_agent"
    parameters:
      personas_pool:
        type: array
        item_type: string
        default: ["all"]
      aggregation_strategy:
        type: string
        default: "weighted"
        enum: ["majority", "consensus", "weighted"]

  stage_8_critical_reading:
    name: "Leitura Crítica"
    description: "Simula leitores virtuais em ciclos focados."
    agent: "critical_reading_coordinator_agent"
    parameters:
      iteration_cycles:
        type: integer
        default: 3
        min: 1
        max: 3
      cycle_focus:
        type: array
        item_type: string
        default: ["clarity", "accuracy", "engagement"]

  stage_9_editing:
    name: "Edição"
    description: "Aplica copidesque e valida Markdown."
    agent: "editing_agent"
    parameters:
      markdown_standard:
        type: string
        default: "commonmark"
        enum: ["commonmark", "gfm"]
      heading_style:
        type: string
        default: "atx"

  stage_10_finalization:
    name: "Finalização"
    description: "Gera capa, sumário navegável e metadados consolidados."
    agent: "finalization_agent"
    parameters:
      cover_style:
        type: string
        default: "modern"
        enum: ["modern", "classic", "minimalist", "vibrant"]
      include_glossary:
        type: boolean
        default: false
      metadata_template:
        type: string
        default: "kdp_standard"

  stage_11_publication:
    name: "KDP e Exportação"
    description: "Exporta para DOCX/EPUB/PDF e monta pacote KDP."
    agent: "publication_agent"
    parameters:
      export_formats:
        type: array
        item_type: string
        default: ["docx", "epub", "pdf"]
      output_directory:
        type: string
        default: "./dist"
      kdp_compliance_strict:
        type: boolean
        default: true
