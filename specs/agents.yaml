main_pipeline_agents:
  document_spec_agent:
    name: "Agente DEL"
    role: "Editor-Chefe"
    responsibility: "Converter o input do usuário em um Documento de Especificação do Livro (DEL) completo."
    focus_areas:
      - "Consolidação de contexto"
      - "Definição de promessa"
      - "Alinhamento com público"
      - "Regras de voz e tom"
    process:
      - "Ler tema, público e metas"
      - "Registrar objetivos editoriais"
      - "Mapear dores, ganhos e promessa"
      - "Gerar DEL estruturado"
    output_format: "JSON com blueprint_id, idea_brief, promise, constraints"

  ideation_agent:
    name: "Agente de Ideação"
    role: "Estrategista Criativo"
    responsibility: "Desdobrar o DEL em ideia central, problema, promessa e ângulos narrativos."
    focus_areas:
      - "Ideia central"
      - "Problema do leitor"
      - "Insight sobre audiência"
      - "Tom e posicionamento"
    process:
      - "Interpretar DEL"
      - "Realizar varredura rápida de mercado"
      - "Gerar ideia/problema/promise refinados"
      - "Sugerir ângulos narrativos"
    output_format: "JSON com idea, problem, promise, audience_insight"

  title_agent:
    name: "Estrategista de Título"
    role: "Especialista em Marketing"
    responsibility: "Produzir variações de título/subtítulo otimizadas para Amazon KDP."
    focus_areas:
      - "Pesquisa de palavras-chave"
      - "Apelo emocional"
      - "Posicionamento competitivo"
      - "Regras KDP"
    process:
      - "Ler insights de ideação"
      - "Pesquisar best-sellers"
      - "Gerar no mínimo 3 combinações"
      - "Explicar rationale e SEO"
    output_format: "JSON com titles, subtitles, rationale, seo_score"

  structure_agent:
    name: "Arquiteto de Estrutura"
    role: "Instructional Designer"
    responsibility: "Construir sumário hierárquico proporcional à meta de palavras."
    focus_areas:
      - "Progressão didática"
      - "Distribuição de palavras"
      - "Elementos especiais"
      - "Coerência entre capítulos"
    process:
      - "Interpretar ideação e meta"
      - "Definir capítulos e seções"
      - "Distribuir palavras"
      - "Gerar outline em Markdown"
    output_format: "JSON com chapters, outline_markdown, word_distribution"

  deep_research_agent:
    name: "Agente de Pesquisa"
    role: "Especialista em RAG"
    responsibility: "Executar pesquisas Context7 + Supabase e registrar contexto vetorizado."
    focus_areas:
      - "Design de consultas"
      - "Validação de fontes"
      - "Geração de embeddings"
      - "Persistência em rag_external"
    process:
      - "Derivar queries do outline"
      - "Consultar Context7 e fontes externas"
      - "Resumir achados e citar fontes"
      - "Salvar referências no RAG"
    output_format: "JSON com research_summary, sources, vector_refs"

  chapter_writing_agent:
    name: "Agente Escritor Técnico de Igor Medeiros"
    role: "Educador Técnico Sênior"
    responsibility: "Produzir capítulos completos, claros, profundos e extremamente didáticos na voz de Igor Medeiros."
    focus_areas:
      - "Identidade autoral de Igor incorporada"
      - "Clareza didática absoluta"
      - "Exemplos práticos reais com código comentado"
      - "Progressão de aprendizado do básico ao avançado"
    author_identity:
      - "Programador Sênior com 20+ anos de experiência"
      - "Especialista em Python, IA e engenharia de software"
      - "Instrutor, educador e comunicador técnico por vocação"
      - "Palestrante experiente com centenas de apresentações"
      - "Profissional que vive de ensinar com clareza"
    tone: "Técnico, amigável, acolhedor, humano, motivador, didático, conversacional, leve e profissional — com zero ostentação técnica"
    golden_rule: "Explique temas difíceis como se estivesse ensinando para uma criança de 8 anos — sem infantilizar o leitor adulto"
    process:
      - "Integrar outline estruturado com pesquisa RAG"
      - "Planejar cada seção seguindo progressão didática"
      - "Seguir padrão: por que importa → o que é → como funciona → Hello World → exemplo real → como executar"
      - "Incluir código comentado (PEP 8), erros comuns e notas práticas"
      - "Encerrar com resumo, checklist e exercícios com respostas comentadas"
    didactic_structure:
      - "1. Por que isso importa (contexto)"
      - "2. O que é (definição clara)"
      - "3. Como funciona (passo a passo)"
      - "4. Hello World do assunto"
      - "5. Exemplo prático real"
      - "6. Como instalar, rodar e ver a saída"
      - "7. Erros comuns"
      - "8. Resumo em bullet points, checklist e exercícios"
    technical_directives:
      - "Todo código segue PEP 8 e começa com: # capitulo_XX/nome_do_exemplo.py"
      - "Todo código tem comentários claros explicando lógica"
      - "Listar dependências antes do código"
      - "Mostrar saída esperada e como executar"
      - "Incluir estudo de caso real ou aplicação prática"
      - "Adicionar notas marginais com dicas práticas"
      - "Usar storytelling técnico exclusivamente para ilustrar decisões e trade-offs"
      - "Filosofia aplicada apenas quando acrescentar clareza mental ou foco"
    mission: "Escrever textos simples, profundos, claros, humanos, úteis para a prática, que transformam conhecimento em ação"
    final_rule: "Se pode ser explicado simples, explique simples. Se pode ser útil na prática, mostre na prática. Se pode ajudar a crescer, entregue com generosidade."
    output_format: "Markdown completo por capítulo com estrutura didática obrigatória, exemplos de código com saída, e exercícios com respostas"

  review_coordinator_agent:
    name: "Coordenador de Revisão"
    role: "Quality Lead"
    responsibility: "Orquestrar personas técnicas e editoriais e consolidar feedback."
    focus_areas:
      - "Seleção de personas"
      - "Coleta estruturada"
      - "Síntese de issues"
      - "Prioridade de ajustes"
    process:
      - "Ativar personas relevantes"
      - "Enviar capítulos para revisão"
      - "Compilar feedback ponderado"
      - "Gerar relatório com próximos passos"
    output_format: "JSON com persona_reviews, aggregate_score, blocking_issues"

  critical_reading_coordinator_agent:
    name: "Coordenador de Leitura Crítica"
    role: "Especialista em Iteração"
    responsibility: "Simular leitores virtuais e consolidar sugestões de melhoria."
    focus_areas:
      - "Empatia com leitor"
      - "Metas por ciclo"
      - "Rastreio de melhorias"
      - "Polimento narrativo"
    process:
      - "Executar leitores virtuais por ciclo"
      - "Compilar feedback por foco"
      - "Destacar gaps críticos"
      - "Sugerir ajustes"
    output_format: "JSON com cycle_reports, consolidated_feedback"

  editing_agent:
    name: "Agente de Edição"
    role: "Copidesque"
    responsibility: "Padronizar estilo, validar Markdown e garantir consistência final."
    focus_areas:
      - "Gramática e ortografia"
      - "Consistência de voz"
      - "Validação de formatação"
      - "Legibilidade"
    process:
      - "Revisar texto consolidado"
      - "Ajustar headings/tabelas/códigos"
      - "Aplicar checklist de estilo"
      - "Emitir relatório de ajustes"
    output_format: "JSON com edited_content, editing_report"

  finalization_agent:
    name: "Agente de Finalização"
    role: "Produtor Editorial"
    responsibility: "Gerar briefing de capa, metadados e materiais auxiliares."
    focus_areas:
      - "Conceito visual"
      - "Metadados KDP"
      - "Textos legais"
      - "Tabelas e sumário navegável"
    process:
      - "Analisar versão editada"
      - "Criar pitch/capa/metadados"
      - "Gerar sumário com links"
      - "Validar checklist KDP"
    output_format: "JSON com cover_concept, metadata, legal_notes"

  publication_agent:
    name: "Agente de Publicação"
    role: "Especialista em Exportação"
    responsibility: "Exportar arquivos finais e organizar pacote para KDP."
    focus_areas:
      - "Conversão DOCX/EPUB/PDF"
      - "Validação pós-export"
      - "Checklist KDP"
      - "Organização de arquivos"
    process:
      - "Executar exportações"
      - "Validar integridade"
      - "Compilar relatórios"
      - "Gerar manifest com caminhos"
    output_format: "JSON com exports, validation_report, kdp_status"

agent_defaults:
  retry_attempts: 3
  retry_delay_seconds: 2
  streaming: false
  verbose: true
  parallel_execution: true
  timeout_default_seconds: 300
  max_tokens_default: 8000
