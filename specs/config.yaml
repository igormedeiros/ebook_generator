labels:
  topic: "Tópico"
  audience: "Público-alvo"
  word_count: "Contagem de Palavras"
  title: "Título"
  outline: "Outline"
  feedback: "Feedback"
  score: "Pontuação"
  status: "Status"
  duration: "Duração"
  tokens_used: "Tokens Utilizados"
  
prompts:
  # Entrada de usuário
  ask_topic: "Qual é o tópico principal do ebook?"
  ask_audience: "Qual é o público-alvo?"
  ask_word_count: "Qual é a contagem de palavras alvo? (padrão: 15000)"
  ask_continue: "Deseja continuar com a próxima etapa?"
  
  # System prompts base
  system_ideation: |
    Você é o Agente de Ideação - especialista em conceituação editorial.
    Sua responsabilidade é transformar ideias brutas em essência coerente de livro.

    Áreas de Foco:
    1. Definição clara do problema central
    2. Identificação precisa do público-alvo
    3. Promessa de transformação compelling
    4. Proposição de valor diferenciada

    Processo:
    - Analisar entrada do usuário
    - Pesquisar contexto e nicho
    - Definir transformação promissora
    - Estruturar proposta de valor

    Formato de Saída:
    JSON com: idea (string), central_problem (string), target_audience (string), transformation_promise (string)

  system_title: |
    Você é o Agente de Geração de Títulos - especialista em marketing editorial.
    Sua responsabilidade é criar títulos otimizados para Amazon KDP.

    Áreas de Foco:
    1. Otimização para SEO e busca
    2. Apelo emocional e valor
    3. Compatibilidade Amazon KDP
    4. Diferenciação no mercado

    Processo:
    - Pesquisar bestsellers no nicho
    - Analisar palavras-chave de alta conversão
    - Gerar 3 variações de título
    - Validar compatibilidade Amazon

    Formato de Saída:
    JSON com: titles (array de 3 títulos), seo_score (0-1), amazon_compliance (bool)

  system_structure: |
    Você é o Agente de Estrutura - especialista em arquitetura editorial.
    Sua responsabilidade é criar índice hierárquico escalado ao target de palavras.

    Áreas de Foco:
    1. Progressão didática lógica
    2. Distribuição equilibrada de palavras
    3. Hierarquia clara de seções
    4. Fluxo de aprendizagem otimizado

    Processo:
    - Definir capítulos baseado em target de palavras
    - Criar seções com distribuição de palavras
    - Estabelecer objetivos de aprendizagem
    - Validar progressão didática

    Formato de Saída:
    JSON com: chapters (array), outline (markdown), word_distribution (dict)

agent_prompts:
  # Estágio 1: Ideation
  ideation_prompt_template: |
    Return JSON with keys idea, problem, promise, and audience_insight. Context:
    Topic: {topic}
    Audience: {target_audience}
    Word Count Target: {word_count_target}
    Reading Level: {reading_level}
    Transformation Promise: {promise_context}
  
  # Estágio 2: Title Generation
  title_prompt_template: |
    Produce exactly three Amazon KDP-ready title options in JSON with fields
    titles (list) and rationales (dict by title). Use these insights:
    {ideation_output}
  
  # Estágio 3: Structure
  structure_prompt_template: |
    Create a Markdown table of contents with chapters, sections, and estimated word counts. Consider:
    Topic: {topic}
    Audience: {target_audience}
    Target Words: {word_count_target}
    Ideation Summary: {ideation_output}
  
  # Estágio 4A: Deep Research
  deep_research_prompt_template: |
    Execute deep research for each outline section and return JSON with research_summary, sources,
    vector_ids, and storage_status. Outline reference:
    {structure_output}
  
  # Estágio 4B: Chapter Writing
  chapter_writing_prompt_template: |
    Write comprehensive chapters based on structure and deep research. Return JSON with
    chapters (dict keyed by chapter title) and word_count_actual. Integrate:
    Structure: {structure_output}
    Research: {deep_research_output}
  
  # Estágio 5: Specialized Review
  review_prompt_template: |
    Provide specialized feedback on:
    {chapter_output}
  
  # Estágio 6: Critical Reading
  critical_reading_prompt_template: |
    Critically evaluate and iterate:
    {review_output}
  
  # Estágio 7: Editing
  editing_prompt_template: |
    Edit for clarity, consistency, and KDP compliance. Return JSON with
    edited_content and validation_report:
    {critical_output}
  
  # Estágio 8: Finalization
  finalization_prompt_template: |
    Generate book summary, create cover concept, compile metadata. Return JSON with
    summary, cover_concept, metadata, and kdp_compliance_check:
    {editing_output}
  
  # Estágio 9: Publication
  publication_prompt_template: |
    Export the ebook to DOCX, EPUB, PDF, and JSON. Return JSON with exports, validation_report, and
    kdp_package_status, highlighting compliance checkpoints. Content excerpt:
    {editing_output_excerpt}

