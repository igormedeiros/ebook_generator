# Configuração centralizada de strings em Português
# Todas as mensagens, labels e textos parametrizáveis

llm_profiles:
  fast_generation:
    label: "Modo Rápido"
    description: |
      Perfil otimizado para tarefas que precisam de respostas rápidas e criativas,
      como brainstorming inicial ou ajustes de texto em tempo real.
    usage_notes: |
      Utilize este perfil quando a prioridade for velocidade e custo reduzido.
      É ideal para ações iterativas onde várias versões precisam ser geradas rapidamente.
    primary:
      name: "Gemini 2.5 Flash"
      provider: "Google AI"
      model_id: "gemini-2.5-flash"
      api_key_env: "GOOGLE_API_KEY"
      strengths:
        - "Respostas em baixa latência"
        - "Texto criativo e fluído"
        - "Boa relação custo/benefício"
      use_cases:
        - "Geração de capítulos e seções em rascunho"
        - "Criação rápida de títulos e subtítulos"
        - "Sugestões instantâneas durante entrevistas com o autor"
    fallback:
      name: "Groq LLaMA 3 70B"
      provider: "Groq"
      model_id: "llama-3.3-70b-versatile"
      api_key_env: "GROQ_API_KEY"
      rationale: |
        Entra em ação quando a API principal estiver indisponível ou
        atingir limites de uso. Mantém o foco em velocidade com custo previsível.
      use_cases:
        - "Mesmas tarefas do modo rápido quando a API principal falhar"
        - "Backups de geração de texto curto"

  deep_reasoning:
    label: "Modo Profundo"
    description: |
      Perfil para análises detalhadas, validação de fatos, integração com RAG
      e qualquer tarefa que exija maior raciocínio estruturado.
    usage_notes: |
      Utilize este perfil quando precisão, consistência lógica e contexto
      longo forem indispensáveis. É o modo padrão para pesquisas e revisões finais.
    primary:
      name: "Gemini 2.5 Pro"
      provider: "Google AI"
      model_id: "gemini-2.5-pro"
      api_key_env: "GOOGLE_API_KEY"
      strengths:
        - "Contexto extenso com alta coerência"
        - "Melhor entendimento de instruções complexas"
        - "Adequado para integrar múltiplas fontes"
      use_cases:
        - "Pesquisa técnica profunda e validação factual"
        - "Síntese final do ebook"
        - "Planejamento estratégico de capítulos"
    fallback:
      name: "Claude 3 Opus"
      provider: "Anthropic"
      model_id: "claude-3-opus-20240229"
      api_key_env: "ANTHROPIC_API_KEY"
      rationale: |
        Mantém alta qualidade analítica quando o modelo principal estiver indisponível.
        Útil especialmente para revisões críticas de conteúdo ou checagens de coerência.
      use_cases:
        - "Auditoria de conteúdo e fact-checking"
        - "Reescrita estratégica de trechos sensíveis"
        - "Tomadas de decisão com múltiplos critérios"

deep_research:
  description: |
    Pipeline de pesquisa profunda com DOIS níveis:

    1. PESQUISA TEMÁTICA ABRANGENTE (Fase 1)
       - Baseada em required_topics do projeto
       - 1 documento por tópico obrigatório
       - Exemplos: "LangChain 1.0", "RAG", "EHRs", "Compliance em Saúde", "Ética em IA"
       - Cada documento: 3000+ palavras, 7+ fontes, 10 seções temáticas
       - Reutilizável para múltiplos capítulos
       - Salvo como: thematic_*.md em kb/
       - SALVAMENTO: Imediato após geração (save_immediately: true)
       
    2. PESQUISA POR CAPÍTULO (Fase 2)
       - Baseada na estrutura de capítulos gerada
       - 1 documento por capítulo do ebook
       - Integra contexto das pesquisas temáticas
       - 2000+ palavras, 5+ fontes
       - Salvo como: research_*.md em kb/
       - SALVAMENTO: Imediato após geração (save_immediately: true)

  requirements:
    thematic:
      minimum_word_count: 3000
      minimum_sources: 7
    chapter:
      minimum_word_count: 2000
      minimum_sources: 5
  include_word_count_in_header: true
  prompt_template: |
    # 📄 Prompt de Deep Research para Base de Conhecimento RAG

    **INSTRUÇÃO PRINCIPAL:** Você é um Engenheiro de Pesquisa Sênior com foco em **Tecnologia Aplicada (IA, Agentes)**. Seu objetivo é conduzir uma pesquisa exaustiva e produzir um documento técnico denso, factual e altamente detalhado sobre **{topic}**.

    Este documento será a **ÚNICA** fonte de verdade para um sistema Retrieval-Augmented Generation (RAG) usado por modelos de linguagem avançados. A qualidade, a profundidade e a granularidade da informação são críticas. Produza no mínimo **{minimum_words} palavras**.

    ---

    ## 🎯 Seções Mandatórias do Documento

    O documento deve ser estruturado em tópicos e subtópicos claros, com foco na explicação técnica, em analogia a um **Artigo de Revisão Científica e um Whitepaper Técnico**.

    ### 1. Resumo Executivo (Máx. 3 Parágrafos)
    * Visão geral concisa da importância do tema e das principais conclusões técnicas do documento.

    ### 2. Introdução e Contextualização do Tema
    * **2.1. Definição e Escopo:** Definição formal, desmistificação de termos comuns e delimitação exata do escopo da pesquisa.
    * **2.2. Relevância no Cenário Atual:** Explique por que este tema é crítico agora com estatísticas, tendências de mercado ou desafios científicos recentes.
    * **2.3. Termos-Chave e Glossário:** Liste pelo menos 10 termos técnicos essenciais com definições precisas.

    ### 3. Profundidade Técnica e Arquitetura/Fundamentos (Corpo Central)
    * **3.1. Fundamentos Teóricos/Bases Científicas:** Princípios, equações ou modelos subjacentes.
    * **3.2. Arquitetura/Implementação Técnica:** Componentes, workflows e tecnologias/frameworks envolvidos.
    * **3.3. Casos de Uso Avançados e Aplicações:** Exemplos concretos, preferencialmente em saúde/neurologia ou automação corporativa.

    ### 4. Desafios, Limitações e Ética (Análise Crítica)
    * Gargalos técnicos atuais, implicações éticas, riscos e comparação com soluções alternativas (SWOT ou análise comparativa).

    ### 5. Tendências Futuras e Conclusão
    * Pesquisas em andamento, próximos passos e síntese final da viabilidade técnica e impacto potencial.

    ---

    ## ⚙️ Critérios de Qualidade para Geração (RAG Optimization)

    1. **Granularidade (Chunking-Ready):** Cada parágrafo aborda uma única ideia ou fato técnico.
    2. **Foco em Dados e Fatos:** Cite números, métricas, algoritmos, protocolos e referências técnicas sempre que possível.
    3. **Priorize Fontes Oficiais:** Documentação oficial, órgãos reguladores, papers revisados por pares e fontes com reputação comprovada.
    4. **Formato:** Use Markdown com listas numeradas/bullets para facilitar chunking.
    5. **Profundidade:** Presuma leitor com background técnico sênior; evite explicações superficiais.
    6. **Código:** Inclua exemplos em Python/YAML quando o tema for uma tecnologia, framework ou agente; explique linha a linha quando necessário.
    7. **Conexão com o Ebook:** Reforce como o tema apoia o projeto "{ebook_name}" e o público-alvo "{target_audience}".

    ---

    ## 📌 Contexto Adicional Obrigatório

    - Ebook: {ebook_name}
    - Descrição: {ebook_description}
    - Público-alvo: {target_audience}
    - Tópicos Obrigatórios (BRD) para manter alinhamento entre pesquisas:
    {required_topics_list}

    **A SAÍDA DEVE SER APENAS O DOCUMENTO DE PESQUISA EM MARKDOWN, SEGUINDO A ESTRUTURA ACIMA, COM ALTA DENSIDADE INFORMACIONAL.**

  thematic_research:
    save_immediately: true
    description: "Salva cada pesquisa temática em kb/ imediatamente após geração"
    directory: "kb"
    naming_pattern: "thematic_{sanitized_topic}.md"
    technical_depth: "deeply_technical"
    technical_depth_description: |
      NÍVEL DE PROFUNDIDADE: PROFUNDAMENTE TÉCNICO
      
      Este nível é apropriado para:
      - Públicos com background técnico (dados scientists, engenheiros, arquitetos)
      - Documentação que presume familiaridade com conceitos base
      - Detalhamento de implementação, não apenas conceitos
      - Discussão de trade-offs, performance e scalability
      
      Características:
      ✓ Assume conhecimento prévio do domínio (não é introdutório)
      ✓ Apresenta diagramas de arquitetura complexos
      ✓ Exemplos de código são funcionais e reutilizáveis
      ✓ Inclui performance metrics, benchmarks, comparações
      ✓ Discussão de limitações, edge cases, anti-padrões
      ✓ Referências a papers, RFC, documentação oficial
      ✓ Explicação de trade-offs e decisões de design
      ✓ Integração com ferramentas e frameworks reais
    
    metadata_format: |
      # Pesquisa Temática: {topic}
      
      Ebook: {ebook_name}
      Data: {timestamp}
      Tipo: Pesquisa Temática Abrangente
      Profundidade: Profundamente Técnico
      
      ---
    
    code_examples_requirement: |
      IMPORTANTE: Se o tópico for um FRAMEWORK, BIBLIOTECA ou TECNOLOGIA:
      
      ✓ OBRIGATÓRIO incluir exemplos de código fonte:
        - Estrutura de código comentada
        - Snippets práticos funcionais
        - Padrões de uso comum
        - Integração com LangChain quando aplicável
      
      ✓ Formatos de código:
        - Python (primário para este ebook)
        - YAML para configurações
        - Pseudocódigo para conceitos abstratos
      
      ✓ Elementos adicionais para frameworks:
        - Diagrama de arquitetura textual (usando ASCII)
        - Fluxo de execução comentado
        - Casos de uso reais
        - Erros comuns e como evitá-los
      
      Exemplos de tópicos que REQUEREM código:
        - "LangChain 1.0" → código de agents, tools, chains
        - "RAG" → código de retrieval, augmentation, generation
        - "EHRs" → estrutura de dados, queries
        - Qualquer ferramenta ou framework específico
      
      Exemplos de tópicos que SÃO CONCEITUAIS:
        - "Ética em IA" → discussão, não requer código
        - "Compliance em Saúde" → regulamentação, não requer código
    
    technical_guidelines: |
      PROFUNDIDADE TÉCNICA - DIRETRIZES PARA REDAÇÃO:
      
      ✓ NÃO seja superficial: vá além de "o que é"
      ✓ SIM para profundidade: explique "por quê", "como" e "trade-offs"
      ✓ INCLUA diagramas de arquitetura (ASCII art)
      ✓ DISCUTA performance: limitações, benchmarks, escalabilidade
      ✓ ABORDE edge cases: situações especiais, erros, exceções
      ✓ COMPARE com alternativas: qual é melhor em qual cenário?
      ✓ CITE fontes: papers, documentação oficial, RFCs
      ✓ USE exemplos funcionais: código que pode ser copiado e executado
      ✓ EXPLIQUE decisões de design: por que foi feito assim?
      ✓ CONTEXTUALIZE para saúde: como isso se aplica em ambientes clínicos?
      
      Estrutura esperada por seção (exemplo):
        - Conceito
        - Arquitetura / Como funciona internamente
        - Implementação (com código)
        - Performance / Limitações
        - Trade-offs vs alternativas
        - Casos de uso reais
        - Erros frequentes
        - Integração com LangChain
        - Aplicação clínica
  
  chapter_research:
    save_immediately: true
    description: "Salva cada pesquisa por capítulo em kb/ imediatamente após geração"
    directory: "kb"
    technical_depth: "deeply_technical"
    naming_pattern: "research_{sanitized_chapter}.md"
    metadata_format: |
      # Pesquisa: {chapter}
      
      Ebook: {ebook_name}
      Data: {timestamp}
      Tipo: Pesquisa por Capítulo
      Profundidade: Profundamente Técnico
      
      ---
  
  examples:
    ebook_project:
      name: "LangChain na Saúde - Agentes de IA para Clínica"
      chapters: 10
      required_topics: 9
      phase_1_thematic_research:
        - topic: "LangChain 1.0"
          filename: "thematic_langchain_1_0.md"
          word_count: "3500+"
          sources: "8+"
          sections:
            - "Resumo Executivo (história, evolução, estado-da-arte)"
            - "Arquitetura de Agentes"
            - "Integração com LangChain 1.0"
            - "Melhores Práticas"
            - "Anti-padrões"
            - "Aplicabilidade Clínica"
            - "Compliance e Ética"
            - "Implementação Prática com Exemplos"
            - "Integração com EHRs"
            - "Referências e Glossário"
        
        - topic: "RAG (Retrieval-Augmented Generation)"
          filename: "thematic_rag.md"
          word_count: "3500+"
          sources: "8+"
          focus: "RAG em ambientes clínicos, integração com dados sensíveis, melhores práticas"
        
        - topic: "Registros Eletrônicos de Saúde (EHRs)"
          filename: "thematic_ehrs.md"
          word_count: "3500+"
          sources: "8+"
          focus: "Estrutura de dados EHR, segurança, compliance LGPD, padrões clínicos"
        
        - topic: "Compliance em Saúde"
          filename: "thematic_compliance.md"
          word_count: "3500+"
          sources: "8+"
          focus: "LGPD, normas clínicas brasileiras, auditoria, rastreabilidade"
        
        - topic: "Ética em IA Clínica"
          filename: "thematic_ethics.md"
          word_count: "3500+"
          sources: "8+"
          focus: "Vieses algorítmicos, transparência, responsabilidade, consentimento informado"
      
      phase_2_chapter_research:
        - chapter: "Capítulo 1: Introdução à IA na Saúde"
          filename: "research_introducao_ia_saude.md"
          word_count: "2000+"
          sources: "5+"
          uses_thematic: ["LangChain 1.0", "Ética em IA Clínica"]
        
        - chapter: "Capítulo 2: Fundamentos do LangChain 1.0"
          filename: "research_fundamentos_langchain.md"
          word_count: "2000+"
          sources: "5+"
          uses_thematic: ["LangChain 1.0"]
        
        - chapter: "Capítulo 3: RAG e Arquiteturas Avançadas"
          filename: "research_rag_arquiteturas.md"
          word_count: "2000+"
          sources: "5+"
          uses_thematic: ["RAG", "Registros Eletrônicos de Saúde (EHRs)"]
        
        - chapter: "Capítulo 4: EHRs e Pré-processamento"
          filename: "research_ehrs_preprocessamento.md"
          word_count: "2000+"
          sources: "5+"
          uses_thematic: ["Registros Eletrônicos de Saúde (EHRs)", "Compliance em Saúde"]
        
        - chapter: "Capítulo 5: Implementação de Agentes"
          filename: "research_implementacao_agentes.md"
          word_count: "2000+"
          sources: "5+"
          uses_thematic: ["LangChain 1.0", "RAG", "Compliance em Saúde"]
  
  search_prompt: "Realize uma pesquisa profunda sobre o seguinte tópico e retorne um resumo detalhado com fontes confiáveis:"
  storage_confirmation: "Os resultados da pesquisa foram armazenados com sucesso no sistema RAG."
  minimum_word_count: 2000
  minimum_sources: 5
  thematic_minimum_word_count: 3000
  thematic_minimum_sources: 7
  retrieval_prompt: "Recupere o contexto relevante do sistema RAG para a seguinte consulta:"


